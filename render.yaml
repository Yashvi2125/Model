services:
  # FastAPI Backend + Telegram Webhook + WebSockets
  - type: web
    name: tripmate-backend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: TAVILY_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: Tripmate_planner_bot
      - key: TELEGRAM_MODE
        value: webhook
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TELEGRAPH_ACCESS_TOKEN
        sync: false
      - key: RELAY_WEB_TO_TELEGRAM
        value: "true"

  # React Single Page Application (Static Site)
  - type: web
    name: tripmate-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false
