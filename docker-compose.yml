# TripMate AI — Multi-Agent Group Trip Planner
#   web      http://localhost:3000        (React + nginx; proxies /api and WebSockets to the backend)
#   backend  http://localhost:8000        (FastAPI; docs at /api/docs)
#   db       PostgreSQL 16, data in the "pgdata" volume (not published to your host)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tripmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-tripmate}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside Docker the database host is the service name "db", never "localhost".
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tripmate}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tripmate}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  pgdata:
